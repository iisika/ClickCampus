
<!DOCTYPE html>
<html lang="en">
<head>
    {% load static %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ClickCampus | Student Registration</title>

    <link rel="stylesheet" href="{% static 'transport/style.css' %}">
</head>

<body class="auth-page">

    <main class="auth-container">

        <a href="{% url 'transport:dashboard' %}" class="auth-brand">
            <img
                src="{% static 'transport/image/clickcampus-logo.png' %}"
                alt="ClickCampus logo"
                class="brand-logo"
            >
            <span>ClickCampus</span>
        </a>

        <section class="auth-card">
            <p class="eyebrow">JOIN CLICKCAMPUS</p>

            <h1>Create your account</h1>

            <p class="muted">
                Register to manage your campus transport.
            </p>

            <form id="register-form">

                <label for="full-name">Full name</label>

                <input
                    type="text"
                    id="full-name"
                    name="full_name"
                    placeholder="Enter your full name"
                    autocomplete="name"
                    required
                >

                <label for="student-email-register">University email</label>

                <input
                    type="email"
                    id="student-email-register"
                    name="email"
                    placeholder="Enter your university email"
                    autocomplete="email"
                    required
                >

                <label for="registration-number">
                    Student registration number
                </label>

                <input
                    type="text"
                    id="registration-number"
                    name="registration_number"
                    placeholder="Enter your student number"
                    required
                >

                <label for="register-password">Password</label>

                <input
                    type="password"
                    id="register-password"
                    name="password"
                    placeholder="Create a password"
                    autocomplete="new-password"
                    minlength="8"
                    required
                >

                <label for="confirm-password">Confirm password</label>

                <input
                    type="password"
                    id="confirm-password"
                    name="confirm_password"
                    placeholder="Enter your password again"
                    autocomplete="new-password"
                    minlength="8"
                    required
                >

                <button
                    type="submit"
                    class="primary-button full-width"
                >
                    Create Account
                </button>

                <p
                    id="register-message"
                    class="form-message"
                    aria-live="polite"
                ></p>

            </form>

            <p class="auth-footer">
                Already have an account?
                <a href="{% url 'transport:login' %}">
                    Sign in
                </a>
            </p>

            <p class="demo-notice">
                Demo only: account details are not saved.
            </p>
        </section>

        <p class="auth-bottom">
            ClickCampus · Campus transport made easier
        </p>

    </main>

    <script>
        const registerForm = document.getElementById("register-form");
        const registerMessage = document.getElementById("register-message");

        registerForm.addEventListener("submit", function(event) {
            event.preventDefault();

            const password =
                document.getElementById("register-password").value;

            const confirmPassword =
                document.getElementById("confirm-password").value;

            if (password !== confirmPassword) {
                registerMessage.textContent =
                    "The passwords do not match. Please try again.";

                registerMessage.className = "form-message";
                return;
            }

            registerMessage.textContent =
                "The registration form works, but account creation still needs backend integration.";

            registerMessage.className = "form-message";
        });
    </script>

</body>
</html>
