
<!DOCTYPE html>
<html lang="en">
<head>
    {% load static %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClickCampus | Student Login</title>

    <link rel="stylesheet" href="{% static 'transport/style.css' %}">

    <style>
        /* Keep the login content visible */
        .auth-page {
            min-height: 100vh;
        }

        .auth-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 24px;
            box-sizing: border-box;
        }

        .auth-brand {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 24px;
            text-decoration: none;
        }

        .auth-card {
            display: block;
            width: 100%;
            max-width: 440px;
            box-sizing: border-box;
        }

        .auth-card input {
            display: block;
            width: 100%;
            box-sizing: border-box;
            margin: 8px 0 18px;
        }

        .auth-card label {
            display: block;
        }

        .auth-card button {
            display: block;
            width: 100%;
            cursor: pointer;
        }

        .auth-footer,
        .auth-bottom,
        .demo-notice {
            text-align: center;
        }
    </style>
</head>

<body class="auth-page">

    <main class="auth-container">

        <a href="{% url 'transport:dashboard' %}" class="auth-brand">
            <img
                src="{% static 'transport/image/clickcampus-logo.png' %}"
                alt="ClickCampus logo"
                class="brand-logo"
            >
            <span>ClickCampus</span>
        </a>

        <section class="auth-card">

            <p class="eyebrow">WELCOME BACK</p>

            <h1>Student Login</h1>

            <p class="muted">
                Sign in to manage your campus transport.
            </p>

            <form id="login-form">

                <label for="student-email">University email</label>
                <input
                    type="email"
                    id="student-email"
                    name="email"
                    placeholder="Enter your university email"
                    autocomplete="username"
                    required
                >

                <label for="student-password">Password</label>
                <input
                    type="password"
                    id="student-password"
                    name="password"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    required
                >

                <button
                    type="submit"
                    class="primary-button full-width"
                >
                    Sign In
                </button>

                <p
                    id="login-message"
                    class="form-message"
                    aria-live="polite"
                ></p>

            </form>

            <p class="auth-footer">
                Don't have an account?
                <a href="{% url 'transport:register' %}">
                    Create an account
                </a>
            </p>

            <p class="demo-notice">
                Demo only: login is not yet connected to the backend.
            </p>

        </section>

        <p class="auth-bottom">
            ClickCampus · Campus transport made easier
        </p>

    </main>

    <script>
        const loginForm = document.getElementById("login-form");
        const loginMessage = document.getElementById("login-message");

        loginForm.addEventListener("submit", function(event) {
            event.preventDefault();

            loginMessage.textContent =
                "The login interface is ready. Authentication still needs to be connected to the backend.";
        });
    </script>

</body>
</html>
